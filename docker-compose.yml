  version: '3'

  networks:
    holter-network:
      name: holter

  services:
    postgres:
      image: postgres:${POSTGRES_VERSION}
      hostname: postgres
      ports:
        - ${POSTGRES_PORT}:5432
      volumes:
        - ./postgres:/var/lib/postgresql/data
        - ./initdb:/docker-entrypoint-initdb.d
      networks:
        - holter-network
      environment:
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      restart: always
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}"]
        interval: 10s
        timeout: 30s
        retries: 10
    
    holter:
      build: .
      image: harbor.tce.rn.gov.br/metrics/holter
      networks:
        - holter-network
      ports:
        - 8080:8080
      environment:
        POSTGRES_HOST: ${POSTGRES_HOST}
        POSTGRES_DB: ${POSTGRES_DB}
        POSTGRES_PORT: ${POSTGRES_PORT}
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        DATABASE_PATH: /data
        TOKEN_SECRET: 6aca05987fcaf7aadd24f158106df506d3d6ef7a6f40c12014a002b72ecc9b394db118836650beb89627f75f454217544ba3de7948252de0f6dac17af2f080ab
      volumes:
        - /data/holter:/data
      healthcheck:
        test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://holter:8080/holter/api/test || exit 1"]
        interval: 30s
        timeout: 10s
        retries: 3
      depends_on:
        postgres:
          condition: service_healthy